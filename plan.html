<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИП Помощник - Пошаговый план</title>
    <link rel="icon" type="image/png" href="files/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        
        <!-- Шапка сайта -->
        <header class="header-card">
    <a href="about.html" class="logo">ИП Помощник</a>
    <nav class="navigation">
        <a href="index.html">Главная</a>
        <a href="plan.html" class="active">План</a>
        <a href="oformlenie.html">Оформление</a>
        <a href="primery.html">Примеры</a>
        <a href="templates.html">Шаблоны</a>
        <a href="faq.html">FAQ</a>
        <a href="reviews.html">Отзывы</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" title="Переключить тему">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>
    </button>
</header>

        <!-- Основной контент -->
        <main class="content-card">
            
            <div class="page-header">
                <h1>Пошаговый план работы над проектом</h1>
                <p class="subtitle">Краткое пояснение: что здесь и зачем</p>
            </div>

            <!-- Кружки с этапами -->
            <div class="steps-navigation">
                <button class="step-btn active" data-step="1">1</button>
                <button class="step-btn" data-step="2">2</button>
                <button class="step-btn" data-step="3">3</button>
                <button class="step-btn" data-step="4">4</button>
                <button class="step-btn" data-step="5">5</button>
                <button class="step-btn" data-step="6">6</button>
            </div>

            <!-- Большая белая карточка с контентом -->
            <div class="step-card" id="step-card">
                <div class="step-card-header">
                    <h2 class="step-title" id="step-title">Этап 1</h2>
                    <h3 class="step-subtitle" id="step-subtitle">Выбор темы</h3>
                </div>
                <div class="step-content" id="step-content">
                    <!-- Текст будет подставлен через JS -->
                </div>
            </div>

        </main>
    </div>

    <script>
        // Данные для каждого этапа
        const stepsData = {
            1: { 
                title: "Этап 1", 
                subtitle: "Выбор темы", 
                content: `
                    <p><strong>Что делать:</strong> Подумай, что тебе действительно интересно. Тема должна быть связана с твоим профилем и увлекать тебя лично.</p>
                    <p><strong>Проверь себя:</strong> Сможешь ли ты найти по этой теме информацию? Есть ли о чём рассказать комиссии?</p>
                    <p><strong>Проблема:</strong> Сформулируй, что не так в мире и что ты хочешь изменить своим проектом.</p>
                    <p><strong>Актуальность:</strong> Почему эта тема важна именно сейчас — в 2026 году?</p>
                    <p><strong>Совет:</strong> Не бери тему, которая тебе скучна. С ней ты проведёшь целый год.</p>
                ` 
            },
            2: { 
                title: "Этап 2", 
                subtitle: "Цель и задачи", 
                content: `
                    <p><strong>Цель:</strong> Одно предложение — что ты хочешь получить в итоге. Формулируй глаголом: «создать», «разработать», «исследовать».</p>
                    <p><strong>Задачи:</strong> 3–5 шагов, которые приведут к цели. Например: изучить литературу, провести опрос, создать продукт.</p>
                    <p><strong>Простота:</strong> Убери из формулировок «воду» и сложные слова — пиши так, чтобы понял одноклассник.</p>
                    <p><strong>Польза:</strong> Задай себе вопрос — кому пригодится то, что ты сделаешь?</p>
                    <p><strong>Совет:</strong> Цель одна, задач несколько. Не путай их.</p>
                ` 
            },
            3: { 
                title: "Этап 3", 
                subtitle: "Исследование", 
                content: `
                    <p><strong>Источники:</strong> Ищи информацию минимум в 5 разных местах: книги, сайты, статьи, видео, интервью.</p>
                    <p><strong>Записывай:</strong> Сразу сохраняй ссылки и авторов — потом пригодится для списка литературы.</p>
                    <p><strong>Практика:</strong> Если тема позволяет — проведи опрос, эксперимент или наблюдение. Это сильный аргумент на защите.</p>
                    <p><strong>Фильтр:</strong> Оставляй только то, что относится к твоей цели. Всё остальное — лишнее.</p>
                    <p><strong>Выводы:</strong> После каждого этапа записывай короткий вывод: «Что я узнал нового?»</p>
                ` 
            },
            4: { 
                title: "Этап 4", 
                subtitle: "Продукт", 
                content: `
                    <p><strong>Продукт:</strong> Это то, что можно потрогать, показать или продемонстрировать. Не реферат, а конкретный результат.</p>
                    <p><strong>Примеры:</strong> Сайт, приложение, макет, изделие, видео, буклет, проведённое исследование с выводами.</p>
                    <p><strong>Связь:</strong> Продукт должен решать твою цель и быть связан с темой.</p>
                    <p><strong>Демонстрация:</strong> На защите ты покажешь продукт комиссии. Если он большой — покажи главное, остальное опиши.</p>
                    <p><strong>Тест:</strong> Ответь на вопрос «Что я сделал?» одним предложением. Если получилось — продукт сформулирован верно.</p>
                ` 
            },
            5: { 
                title: "Этап 5", 
                subtitle: "Оформление", 
                content: `
                    <p><strong>Структура работы:</strong> Титульный лист → содержание → введение → основная часть → заключение → список литературы → приложения.</p>
                    <p><strong>Титульный лист:</strong> Школа, тема, ФИО автора, класс, ФИО руководителя, город и год.</p>
                    <p><strong>Введение:</strong> Почему выбрал тему, какая цель, какие задачи. Объём — 1–2 страницы.</p>
                    <p><strong>Заключение:</strong> Что получилось, достиг ли цели, какие выводы сделал.</p>
                    <p><strong>Список литературы:</strong> Все источники, которые использовал. Оформляй по порядку.</p>
                    <a href="oformlenie.html" class="step-link">Подробнее →</a>
                ` 
            },
            6: { 
                title: "Этап 6", 
                subtitle: "Защита", 
                content: `
                    <p><strong>Время:</strong> Речь — на 5–7 минут. Комиссия не любит долгие выступления.</p>
                    <p><strong>Что рассказать:</strong> Почему выбрал тему, какую цель ставил, что делал, какой результат получил.</p>
                    <p><strong>Презентация:</strong> 10–12 слайдов. Мало текста, больше картинок и скриншотов продукта.</p>
                    <p><strong>Один слайд — одна мысль.</strong> Не пихай всё на одну страницу.</p>
                    <p><strong>Голос:</strong> Не читай с листа — рассказывай своими словами. Так выглядишь увереннее.</p>
                    <p><strong>Совет:</strong> Отрепетируй речь 2–3 раза перед зеркалом или родителями.</p>
                ` 
            }
        };

        // Функция для отображения выбранного шага
        const stepButtons = document.querySelectorAll('.step-btn');
        const stepTitle = document.getElementById('step-title');
        const stepSubtitle = document.getElementById('step-subtitle');
        const stepContent = document.getElementById('step-content');

        function showStep(stepNumber) {
            const data = stepsData[stepNumber];
            stepTitle.textContent = data.title;
            stepSubtitle.textContent = data.subtitle;
            stepContent.innerHTML = data.content;
        }

        // Обработчик кликов
        stepButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Убираем активный класс у всех
                stepButtons.forEach(b => b.classList.remove('active'));
                // Добавляем текущему
                btn.classList.add('active');
                // Показываем контент
                showStep(btn.dataset.step);
            });
        });

        // По умолчанию показываем 2-й этап (как на первой картинке)
        showStep(1);
        document.querySelector('[data-step="1"]').classList.add('active');
    </script>
<script>
    (function() {
        var themeToggle = document.getElementById('themeToggle');
        var currentTheme = localStorage.getItem('theme') || 'light';

        // Применяем сохранённую тему сразу при загрузке
        document.documentElement.setAttribute('data-theme', currentTheme);

        // Клик по кнопке — переключаем тему
        themeToggle.addEventListener('click', function() {
            var theme = document.documentElement.getAttribute('data-theme');
            var newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    })();
</script>

</body>
</html>
